<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon" />
    <title>StZori | Chatbot</title>
  </head>
  <body>
    <nav>
      <a href="index.html"><img src="img/logo.png" alt="" class="logo" /></a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="docs.html">Docs</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="chatbot.html">Chatbot</a></li>
      </ul>
    </nav>
    <div class="detectorbod">
      <div class="content">
        <div class="detectorbodtext">
          <h1>If you have any query,</h1>
          <h2>Feel free to ask the chatbot</h2>
        </div>
        <div class="search-box">
          <input
            type="text"
            id="userInput"
            placeholder="
            Learn more about dark patterns..."
          />

          <button id="submitBtn">Ask</button>
        </div>

        <div class="output"></div>
      </div>
    </div>
    <script>
      const userInput = document.getElementById("userInput");

      const submitBtn = document.getElementById("submitBtn");

      const output = document.querySelector(".output");

      submitBtn.addEventListener("click", async () => {
        const prompt = userInput.value.trim();

        if (!prompt) {
          output.innerHTML = `
            <p>Please enter something.</p>
        `;

          return;
        }

        output.innerHTML = `
        <p>Analyzing...</p>
    `;

        try {
          const response = await fetch(
            "https://arthashastra-wkwn.onrender.com/analyze",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                message: prompt,
              }),
            },
          );

          const data = await response.json();

          output.innerHTML = `
            <h2>Analysis</h2>

            <p>${data.reply.replace(/\n/g, "<br>")}</p>
        `;
        } catch (error) {
          console.error(error);

          output.innerHTML = `
            <p>Something went wrong.</p>
        `;
        }
      });

      userInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          submitBtn.click();
        }
      });
    </script>
  </body>
</html>
